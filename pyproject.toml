[project]
name = "open_posttraining_system"
version = "0.1.0"
description = "Post-training system for reasoning models"
authors = [{name = "Shaheen Nabi"}]
dependencies = [
    "transformers==4.57.6",
    "huggingface_hub==0.36.2",
    "tokenizers==0.22.2",
    "from-root",
    "datasets",
    "requests",
    "safetensors==0.7.0",
    "sympy",
    "matplotlib",
    "scikit-learn",
    "jax[cpu]",
    "flax",
    "optax",
    "orbax-checkpoint",
    "chex",
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["logger*", "test*"]
